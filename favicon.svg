<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#4ecdc4"/>
  <g fill="#1d2233" stroke="#1d2233" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms spread wide -->
    <path d="M20 26 Q12 22 5 21" fill="none" stroke-width="7.5"/>
    <path d="M44 26 Q52 22 59 21" fill="none" stroke-width="7.5"/>
    <!-- thick thighs out to the knees, shins down, feet turned out -->
    <path d="M24 44 Q14 43 11 49" fill="none" stroke-width="12"/>
    <path d="M40 44 Q50 43 53 49" fill="none" stroke-width="12"/>
    <path d="M11 49 L11 56" fill="none" stroke-width="8"/>
    <path d="M53 49 L53 56" fill="none" stroke-width="8"/>
    <ellipse cx="9" cy="58" rx="5" ry="2.2" stroke="none"/>
    <ellipse cx="55" cy="58" rx="5" ry="2.2" stroke="none"/>
    <!-- head and topknot -->
    <circle cx="32" cy="13.5" r="6.5" stroke="none"/>
    <ellipse cx="32" cy="6" rx="3.2" ry="2.1" stroke="none"/>
    <!-- huge belly -->
    <ellipse cx="32" cy="34" rx="19.5" ry="16" stroke="none"/>
  </g>
  <!-- mawashi belt and apron -->
  <path d="M14 40 Q32 47 50 40" fill="none" stroke="#4ecdc4" stroke-width="2"/>
  <path d="M26 45 L25.5 59 L38.5 59 L38 45" fill="#1d2233" stroke="#4ecdc4" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M32 47.5 L30.5 51.5 L33 52.5 L31.5 56.5" fill="none" stroke="#4ecdc4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
